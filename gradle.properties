org.gradle.jvmargs=-Xmx512m -Djava.net.preferIPv4Stack=true

# The IntelliJ Platform already bundles kotlin-stdlib; stop the Kotlin Gradle
# plugin from injecting its own (verifyPluginConfiguration rejects the conflict).
kotlin.stdlib.default.dependency=false
org.gradle.caching=true

# Build JVM for the IntelliJ Gradle Plugin. Targeting intellij.version 2022.2
# (below 2022.3) requires only Java 11+. JDK 17 satisfies this floor; swap in a
# real JDK 11 path here if you prefer to build with Java 11 exactly.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.0.18+8/Contents/Home
